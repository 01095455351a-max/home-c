# ══════════════════════════════════════════════════════════════════════════════
# 해아림한의원 잠실점 - 공통 연락처 / 빠른연결 링크
# 아래 값들이 우측 플로팅 퀵메뉴, 공통 하단(상담신청/진료시간/오시는길), 각 상세 페이지의
# CTA 버튼에서 공통으로 사용됩니다. 실제 링크가 정해지면 이 블록만 수정하면 전체 사이트에 반영됩니다.
# ══════════════════════════════════════════════════════════════════════════════
clinic:
  phone_display: "02-6954-7575" # 화면에 보이는 전화번호
  phone_tel: "tel:02-6954-7575" # 실제 클릭 시 연결되는 전화번호 (표시 번호와 통일)
  naver_booking_url: "https://map.naver.com/p/entry/place/1887559338?placePath=%2Fhome%3Fentry%3Dplt%26from%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76%26timestamp%3D202608220007%26locale%3Dko%26svcName%3Dmap_pcv5&searchType=place&lng=127.0819814&lat=37.5114327&c=15.00,0,0,0,dh"
  kakao_channel_url: "https://pf.kakao.com/_xkqufn"
  naver_blog_url: "https://blog.naver.com/healimjs"
  instagram_url: "https://www.instagram.com/healimjs"
  youtube_url: "https://www.youtube.com/@%ED%95%B4%EC%95%84%EB%A6%BC-g5w/videos"
  network_site_url: "https://www.healim.com" # 해아림한의원 네트워크 홈페이지
  consult_form_endpoint: "consult" # Netlify Forms form name
  # 네이버클라우드플랫폼(https://www.ncloud.com) > Maps > Application 등록 후 발급받는 Client ID.
  # 비워두면 오시는 길 지도는 구글 지도로 자동 표시됩니다. (docs/ISSUES.md 참고)
  naver_map_client_id: ""

# ══════════════════════════════════════════════════════════════════════════════
# HUGO BLOX CONFIGURATION
# Schema: hugoblox.com/schema/v2
# Tutorial: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# ══════════════════════════════════════════════════════════════════════════════
hugoblox:
  schema: "2.0"

  # ────────────────────────────────────────────────────────────────────────────
  # IDENTITY
  # Site-level branding (for people/profiles, use the author system in content/authors/)
  # ────────────────────────────────────────────────────────────────────────────
  identity:
    # Site name - shown in navbar, footer, copyright, and browser title by default
    name: "해아림한의원 잠실점"
    # Legal entity for copyright notices (defaults to name if not set)
    organization: "해아림한의원 잠실점"
    # Schema.org type for structured data
    type: local_business # person | organization | local_business
    # Short tagline displayed on your site
    tagline: "마음의 불안부터 두뇌의 균형까지 — 2인의 전담 원장이 세밀하게 동행합니다"
    # Site meta description for search engines and social sharing
    description: "잠실새내역 위치. 공황·불안·불면(석선희 전문의) & 틱·ADHD·자율신경(류석균 원장). 맞춤 한약과 심층 진료로 평온한 일상을 돕습니다."
    # Social accounts (used for meta tags like Twitter Cards)
    social:
      # Site-wide social links (rendered in footer, etc.)
      links:
        - icon: brands/instagram
          url: https://www.instagram.com/healimjs

  # ────────────────────────────────────────────────────────────────────────────
  # THEME
  # Color and visual design system
  # ────────────────────────────────────────────────────────────────────────────
  theme:
    # Mode: 'light', 'dark', or 'system' (follows OS preference)
    mode: system
    # Theme pack: name from data/themes/ or { light: "x", dark: "y" } for mix-and-match
    pack: "default"
    # Optional: Override theme pack colors
    colors:
      # 기존 아임웹 홈페이지(healimjs1.imweb.me)의 청록색 브랜드를 유지하되,
      # 채도를 낮추고 밝기를 올려 더 부드럽고 차분한 톤으로 조정 (정신건강 클리닉에 맞는 톤)
      primary: "#3aa5c6"
      secondary: "#2c7a94"
      neutral: "" # Affects gray utilities (text-gray-*, bg-gray-*)
    # Optional: Mode-specific color overrides
    colors_light: {}
    colors_dark: {}
    # Optional: Semantic surface color overrides
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  # ────────────────────────────────────────────────────────────────────────────
  # TYPOGRAPHY
  # Font and text sizing
  # ────────────────────────────────────────────────────────────────────────────
  typography:
    # Theme pack: name from data/fonts/
    pack: "pretendard"

  # ────────────────────────────────────────────────────────────────────────────
  # LAYOUT
  # Spacing and shape tokens
  # ────────────────────────────────────────────────────────────────────────────
  layout:
    # Border radius: 'none', 'sm', 'md', 'lg', or 'full'
    radius: "md"
    # Spacing density: 'compact', 'comfortable', or 'spacious'
    spacing: "spacious"
    # Avatar shape in author profiles
    avatar_shape: circle # circle | square | rounded

  # ────────────────────────────────────────────────────────────────────────────
  # HEADER
  # Site header and navigation bar
  # ────────────────────────────────────────────────────────────────────────────
  header:
    enable: true
    # Header style variant
    block: navbar # navbar | navbar-simple
    # Stick to top on scroll
    sticky: true
    # Show logo in navbar
    show_logo: true
    # Show site title text in navbar
    show_title: true
    # Override navbar title (defaults to identity.name) — logo already reads "해아림한의원", so just add the branch
    title: "잠실점"
    # Menu alignment
    align: center # left | center | right
    # Feature toggles
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: true
    # Call-to-action button
    cta:
      enable: true
      text: "네이버 예약"
      url: "https://map.naver.com/p/entry/place/1887559338?placePath=%2Fhome%3Fentry%3Dplt%26from%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76%26timestamp%3D202608220007%26locale%3Dko%26svcName%3Dmap_pcv5&searchType=place&lng=127.0819814&lat=37.5114327&c=15.00,0,0,0,dh"

  # ────────────────────────────────────────────────────────────────────────────
  # FOOTER
  # Site footer
  # ────────────────────────────────────────────────────────────────────────────
  footer:
    # Footer style variant
    style: columns # minimal | columns | centered
    show_logo: true
    show_title: true
    show_tagline: true
    # Override footer title (defaults to identity.name) — logo already reads "해아림한의원", so just add the branch
    title: "잠실점"
    language_switcher: true
    # Show social icons from identity.social.links
    show_social: true
    # Custom footer text (HTML supported)
    text: ""

  # ────────────────────────────────────────────────────────────────────────────
  # COPYRIGHT
  # Legal notices and licensing
  # ────────────────────────────────────────────────────────────────────────────
  copyright:
    # Copyright notice - supports {year}, {name}, {license} placeholders
    notice: "© {year} {name}. 대표자 석선희, 류석균."
    license:
      type: custom # cc | custom
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

  # ────────────────────────────────────────────────────────────────────────────
  # SEO
  # Search engine optimization - overrides and technical settings
  # ────────────────────────────────────────────────────────────────────────────
  seo:
    # Browser tab title override (defaults to identity.name if not set)
    title: "해아림한의원 잠실점 | 한방신경정신과 전문의 & 22년 임상 원장"
    # For local_business identity type only
    location:
      address:
        street: "올림픽로 102 서일빌딩 3층"
        city: "서울특별시 송파구"
        region: "서울특별시"
        postal_code: ""
        country: "KR"
      coordinates:
        # 네이버 지도 실제 업체 좌표
        latitude: 37.5114327
        longitude: 127.0819814
      phone: "02-6954-7575"
    # AI/LLM crawler guidance (llms.txt)
    ai:
      allow:
        - /
      disallow: []
      note: "해아림한의원 잠실점 공식 홈페이지입니다. 진료·예약 관련 정확한 정보는 병원에 직접 문의해 주세요."
      contact: "02-6954-7575"

  # ────────────────────────────────────────────────────────────────────────────
  # CONTENT
  # Content rendering and behavior
  # ────────────────────────────────────────────────────────────────────────────
  content:
    # Math rendering
    math:
      enable: false
    # Table of contents
    toc:
      enable: true
    # Reading time estimates
    reading_time:
      enable: true
    # Academic citations
    citations:
      style: apa # apa | mla | chicago | ieee

  # ────────────────────────────────────────────────────────────────────────────
  # SEARCH
  # Site search
  # ────────────────────────────────────────────────────────────────────────────
  search:
    enable: true
    # Trending/suggested search terms
    suggestions: []
    # Quick action shortcuts in search modal
    quick_actions: []

  # ────────────────────────────────────────────────────────────────────────────
  # COMMENTS
  # User comments system
  # ────────────────────────────────────────────────────────────────────────────
  comments:
    enable: false
    provider: "" # giscus | disqus
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  # ────────────────────────────────────────────────────────────────────────────
  # ANALYTICS
  # Traffic and behavior analytics
  # ────────────────────────────────────────────────────────────────────────────
  analytics:
    google:
      measurement_id: "" # Google Analytics 4: G-XXXXXXXXXX
    google_tag_manager:
      container_id: "" # GTM-XXXXXXX
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  # ────────────────────────────────────────────────────────────────────────────
  # VERIFICATION
  # Search engine site verification codes
  # ────────────────────────────────────────────────────────────────────────────
  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  # ────────────────────────────────────────────────────────────────────────────
  # REPOSITORY
  # Source code repository for "Edit this page" links
  # ────────────────────────────────────────────────────────────────────────────
  repository:
    enable: false
    url: "" # e.g., https://github.com/username/repo
    branch: main
    content_dir: content

  # ────────────────────────────────────────────────────────────────────────────
  # LOCALE
  # Regional formatting preferences
  # ────────────────────────────────────────────────────────────────────────────
  locale:
    date_format: "2006년 1월 2일" # Go time format
    time_format: "15:04"
    address_format: ko-kr

  # ────────────────────────────────────────────────────────────────────────────
  # SECURITY
  # Security headers and policies (requires Netlify integration)
  # ────────────────────────────────────────────────────────────────────────────
  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow # deny | sameorigin | allow - allow enables iframe embedding
    permissions_policy: ""

  # ────────────────────────────────────────────────────────────────────────────
  # PRIVACY
  # Privacy and compliance features
  # ────────────────────────────────────────────────────────────────────────────
  privacy:
    enable: false
    anonymize_analytics: true

  # ────────────────────────────────────────────────────────────────────────────
  # DEBUG
  # Development and debugging (hidden in production)
  # ────────────────────────────────────────────────────────────────────────────
  debug:
    enable: false
    hud:
      position: bottom-left # top-left | top-right | bottom-left | bottom-right
      opacity: 1.0
    export_logs: true

  # ────────────────────────────────────────────────────────────────────────────
  # PREMIUM
  # Premium features and creator program (affiliates)
  # ────────────────────────────────────────────────────────────────────────────
  pro:
    # Hide "Powered by HugoBlox" attribution
    # Requires: HugoBlox Premium to support HugoBlox via alternative means
    # Note: Even with Premium, you can keep this false to support open source!
    # Get Premium: https://hugoblox.com/premium
    hide_attribution: false

    # Affiliate referral code for rewards program
    # Join affiliate program: https://hugoblox.com/affiliates
    affiliate_code: ""

{{/* 네이버 로그인 후 원본 후기 이미지 자동 교체.
     reviews_unlocked 쿠키(HttpOnly 아님, UI 힌트용)가 있으면 각 후기 카드의
     data-original-src를 fetch해서 시도하고, 실제 인가는 서버(api/reviews/[[path]].js)가
     naver_session(HttpOnly) 쿠키로 다시 검증한다 — 이 스크립트는 UX 편의일 뿐 보안 경계가 아님. */}}
<script>
(function () {
  function hasUnlockedCookie() {
    return document.cookie.split("; ").some(function (c) { return c.indexOf("reviews_unlocked=1") === 0; });
  }

  if (!hasUnlockedCookie()) return;

  document.querySelectorAll("img[data-original-src]").forEach(function (img) {
    fetch(img.getAttribute("data-original-src"), { credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.blob() : Promise.reject(res.status); })
      .then(function (blob) {
        img.src = URL.createObjectURL(blob);
        var overlay = img.parentElement.querySelector(".review-lock-overlay");
        if (overlay) overlay.remove();
      })
      .catch(function () { /* 세션 만료 등 — 잠금 화면 그대로 둠 */ });
  });
})();
</script>
